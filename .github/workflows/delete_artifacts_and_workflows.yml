name: Delete old artifacts and workflow runs mannually
# Run action manually
on: [workflow_dispatch]
permissions: write-all

jobs:
  delete:
    name: Delete Old Artifacts And Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        uses: actions/github-script@v6
        id: artifacts
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            const results = await Promise.allSettled(
              artifacts.map(({ id }) =>
                github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: id,
                })
              )
            )

            const failed = results.filter(r => r.status === 'rejected').length
            core.info(`Deleted ${artifacts.length - failed} of ${artifacts.length} artifact(s).`)
            if (failed > 0) core.setFailed(`${failed} artifact(s) failed to delete — skipping workflow run deletion.`)

      # Only runs if "Delete all artifacts" above succeeded (default step
      # behavior: a step is skipped once a prior step fails).
      - name: Delete all workflow runs
        uses: actions/github-script@v6
        id: workflow_runs
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            // Never delete the run that is currently executing this cleanup —
            // it is still in progress and this is its own log.
            const toDelete = runs.filter(run => run.id !== context.runId)

            const results = await Promise.allSettled(
              toDelete.map(({ id }) =>
                github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: id,
                })
              )
            )

            const failed = results.filter(r => r.status === 'rejected').length
            core.info(`Deleted ${toDelete.length - failed} of ${toDelete.length} workflow run(s).`)
            if (failed > 0) core.warning(`${failed} workflow run(s) failed to delete.`)
